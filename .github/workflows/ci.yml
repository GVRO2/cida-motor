name: CI

on:
  push:
  pull_request:

env:
  TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/resources

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install -r requirements-ci.txt

    - name: Display environment evidence
      shell: bash
      run: |
        echo "=== ENVIRONMENT EVIDENCE ==="
        echo "Commit SHA: ${{ github.sha }}"
        echo "Go Version:"
        go version
        echo "Python Version:"
        python --version
        echo "Tokenizer cached database SHA-256:"
        python -c "import hashlib, pathlib; p=pathlib.Path('resources/9b5ad71b2ce5302211f9c61530b329a4922fc6a4'); print(hashlib.sha256(p.read_bytes()).hexdigest()) if p.exists() else print('file not found')"

    - name: Run Go tests
      run: go test -work ./... -count=1 -v

    - name: Runtime Dependency Policy
      run: python scripts/check_runtime_dependencies.py

    - name: Resource Profile Unit Tests
      run: go test -work ./... -run "TestWorkersForProfile|TestResolveResourceSettings" -count=1 -v

    - name: Worker Determinism
      run: go test -work ./... -run "TestRunPool" -count=1 -v

    - name: Go Race Detector
      if: matrix.os == 'ubuntu-latest'
      run: go test -race ./...

    - name: Run Python tests
      run: python -m pytest -q

    - name: Validation Levels and Harness Decoupling
      run: python -m pytest tests/test_validation_levels.py tests/test_runtime_harness_decoupling.py -q

    - name: Static Analysis
      run: |
        python -m ruff check .
        python -m mypy cida

    - name: Lossless End-to-End Contract
      run: python -m pytest tests/test_lossless_roundtrip.py -q

    - name: Architecture Boundaries
      run: python -m pytest tests/architecture -q

    - name: Coverage Gate
      run: python -m pytest --cov=cida --cov-branch --cov-fail-under=90

    - name: Clean Workspace Gate
      run: python scripts/check_clean_workspace.py

    - name: Workflow Lint (no masked commands in CI gates)
      shell: bash
      run: python -m pytest tests/test_workflow_lint.py -q

  io-failure-contract:
    name: IO Failure Contracts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Run IO failure contract tests
      run: python -m pytest tests/test_corpus_failure_contracts.py tests/test_report_path_safety.py tests/test_sidecar_path_security.py tests/test_durable_writes.py -q

  sidecar-path-security:
    name: Sidecar Path Security on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Run sidecar path security tests
      run: python -m pytest tests/test_sidecar_path_security.py -q -v

  bundle-integrity:
    name: Bundle Runtime Integrity on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Run bundle integrity tests
      run: python -m pytest tests/test_sidecar_validation_errors.py tests/test_sidecar_envelope_e2e.py tests/test_sidecar.py tests/test_bundle_runtime_integrity.py -q

  harness-self-test:
    name: Harness Self-Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Run harness self-tests
      run: python -m pytest tests/test_harness_self_test.py -q

    - name: Runtime Harness Recursive Audit
      run: python scripts/check_runtime_harness_references.py

    - name: Benchmark Policy Audit
      run: python scripts/audit_benchmark_policy.py

  harness-original-project-inspection:
    name: Harness Original Project Inspection on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: harness-self-test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Add upstream remote
      shell: bash
      run: |
        if git remote get-url upstream >/dev/null 2>&1; then
          git remote set-url upstream https://github.com/kaueMarques/cida-motor.git
        else
          git remote add upstream https://github.com/kaueMarques/cida-motor.git
        fi

    - name: Fetch upstream main
      run: git fetch upstream main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Inspect original and HEAD graphs
      run: python scripts/inspect_original_project_harness.py --base-ref upstream/main --runner go --output original-project-harness-${{ matrix.os }}.json

    - name: Upload original inspection artifact
      uses: actions/upload-artifact@v4
      with:
        name: original-project-harness-${{ matrix.os }}
        path: original-project-harness-${{ matrix.os }}.json

  go-lossless-auto-contract:
    name: Go Lossless/Auto Contract on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build motor_v3
      run: go build -o motor_v3_test_bin ./...

    - name: Verify lossless mode correctly rejects unsupported inputs
      shell: bash
      run: |
        mkdir -p /tmp/go_lossless_test_src
        echo 'public class Foo { void bar() {} }' > /tmp/go_lossless_test_src/Foo.java
        exit_code=0
        set +e
        ./motor_v3_test_bin /tmp/go_lossless_test_src /tmp/go_lossless_test_dst --mode=lossless 2>&1; exit_code=$?
        set -e
        python -c "import sys; code=$exit_code; sys.exit(0) if code in (1,4,5) else sys.exit(f'Expected exit 1/4/5, got {code}')"
        if [ -d /tmp/go_lossless_test_dst ]; then
          echo "ERROR: destination directory was unexpectedly created"
          exit 1
        fi

  benchmark:
    name: Performance Producer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install -r requirements-ci.txt

    - name: Run Benchmarks and Generate Manifest
      run: python benchmarks/benchmark_runner.py --manifest-out manifest-${{ matrix.os }}.json

    - name: Balanced Performance Regression Gate
      run: python benchmarks/performance_compare.py --base-ref origin/main --runs 5 --warmups 1 --validation-level balanced --output performance-balanced-${{ matrix.os }}.json

    - name: Strict Validation Benchmark
      run: python benchmarks/performance_compare.py --base-ref origin/main --runs 5 --warmups 1 --validation-level strict --output performance-strict-${{ matrix.os }}.json

    - name: Clean Workspace Gate
      run: python scripts/check_clean_workspace.py

    - name: Upload Manifest Artifact
      uses: actions/upload-artifact@v4
      with:
        name: manifest-${{ matrix.os }}
        path: manifest-${{ matrix.os }}.json

    - name: Upload Balanced Performance Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-balanced-${{ matrix.os }}
        path: performance-balanced-${{ matrix.os }}.json

    - name: Upload Strict Performance Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-strict-${{ matrix.os }}
        path: performance-strict-${{ matrix.os }}.json

  performance-independent-verification:
    name: Performance Independent Verification on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: benchmark
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Download balanced report
      uses: actions/download-artifact@v4
      with:
        name: performance-balanced-${{ matrix.os }}
        path: performance-balanced

    - name: Download strict report
      uses: actions/download-artifact@v4
      with:
        name: performance-strict-${{ matrix.os }}
        path: performance-strict

    - name: Verify performance reports independently
      run: |
        python scripts/verify_performance_report_v2.py performance-balanced/performance-balanced-${{ matrix.os }}.json
        python scripts/verify_performance_report_v2.py performance-strict/performance-strict-${{ matrix.os }}.json

  tknc-context-efficiency:
    name: Context Producer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Production TKNC Generation
      run: python -m pytest tests/test_tknc_production_pipeline.py -q

    - name: Chunk Naming Scale Contract
      run: python -m pytest tests/test_corpus_chunk_naming.py -q

    - name: Alias Codec Contract
      run: python -m pytest tests/test_alias_codec.py -q

    - name: Exact Alias Membership
      run: python -m pytest tests/test_alias_index_v2.py tests/test_alias_index_scale.py tests/test_real_alias_range_contract.py tests/test_alias_false_positive_identifiers.py -q

    - name: Selective Lookup Instrumentation
      run: python -m pytest tests/test_selective_alias_resolution.py tests/test_tknc_context_contract.py tests/test_no_sidecar_search_preload.py tests/test_tknc_context_session.py tests/test_context_session_close.py -q

    - name: Byte-Bounded Cache
      run: python -m pytest tests/test_byte_bounded_cache.py -q

    - name: Content Search Index
      run: python -m pytest tests/test_content_search_index.py tests/test_content_search_index_security.py -q

    - name: Real Search Benchmark
      run: python -m pytest tests/test_context_search_original.py tests/test_context_search_tknc.py -q

    - name: Generic Search Holdout
      run: python -m pytest tests/test_generic_search_holdout.py -q

    - name: Accuracy Validation
      run: python -m pytest tests/test_context_accuracy.py -q

    - name: Full vs Full Context
      run: python -m pytest tests/test_context_usage_benchmark.py::test_full_vs_full_contract -q

    - name: Selective Cold Context Measurement
      run: python -m pytest tests/test_context_usage_benchmark.py::test_selective_cold_contract -q

    - name: Selective Warm Session
      run: python -m pytest tests/test_context_usage_benchmark.py::test_selective_warm_session_contract -q

    - name: Multi-query Break-even
      run: python -m pytest tests/test_context_usage_benchmark.py::test_multi_query_break_even_contract -q

    - name: Required Chunk Lookup
      run: python -m pytest tests/test_context_usage_benchmark.py::test_lookup_reads_only_required_chunks tests/test_context_token_accounting.py tests/test_context_gate_independence.py tests/test_manifest_binding.py tests/test_tknc_multichunk_production.py tests/test_harness_report_events.py tests/test_source_manifest_v2.py tests/test_bundle_manifest_v2.py tests/test_context_metric_semantics.py -q

    - name: Runtime Harness Isolation
      run: python -m pytest tests/test_runtime_harness_decoupling.py -q

    - name: Runtime Harness Recursive Audit
      run: python scripts/check_runtime_harness_references.py

    - name: Generate Context Artifacts
      run: python benchmarks/context_usage_compare.py --output-json context-v5-${{ matrix.os }}.json --output-markdown context-v5-${{ matrix.os }}.md --read-events-json context-read-events-v5-${{ matrix.os }}.json --cache-events-json context-cache-events-v5-${{ matrix.os }}.json --harness-events-json harness-v2-${{ matrix.os }}.json --source-manifest-json source-manifest-v2-${{ matrix.os }}.json --bundle-manifest-json bundle-manifest-v2-${{ matrix.os }}.json

    - name: Upload Context Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: context-v5-${{ matrix.os }}
        path: |
          context-v5-${{ matrix.os }}.json
          context-v5-${{ matrix.os }}.md
          context-read-events-v5-${{ matrix.os }}.json
          context-cache-events-v5-${{ matrix.os }}.json
          source-manifest-v2-${{ matrix.os }}.json
          bundle-manifest-v2-${{ matrix.os }}.json

    - name: Upload Harness Events Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: harness-v2-${{ matrix.os }}
        path: harness-v2-${{ matrix.os }}.json

    - name: Upload Warm Multi-Chunk Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: warm-multichunk-${{ matrix.os }}
        path: context-v5-${{ matrix.os }}.json

  context-independent-verification:
    name: Context Independent Verification on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: tknc-context-efficiency
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Download context report
      uses: actions/download-artifact@v4
      with:
        name: context-v5-${{ matrix.os }}
        path: context-v5

    - name: Download harness events
      uses: actions/download-artifact@v4
      with:
        name: harness-v2-${{ matrix.os }}
        path: harness-v2

    - name: Verify context report independently
      run: python scripts/verify_context_report_v5.py context-v5/context-v5-${{ matrix.os }}.json

    - name: Verify harness events independently
      run: python scripts/verify_harness_events_v2.py harness-v2/harness-v2-${{ matrix.os }}.json

  process-tree-rss:
    name: Process-Tree RSS on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: harness-self-test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Run process-tree RSS tests
      run: python -m pytest tests/test_process_tree_rss.py -q

  generic-search-holdout:
    name: Generic Search Holdout on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Run generic search holdout
      run: python -m pytest tests/test_generic_search_holdout.py -q

  multi-chunk-warm-session:
    name: Multi-Chunk Warm Session on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: tknc-context-efficiency
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Download warm multi-chunk report
      uses: actions/download-artifact@v4
      with:
        name: warm-multichunk-${{ matrix.os }}
        path: warm-multichunk

    - name: Verify warm multi-chunk report
      run: python scripts/verify_context_report_v5.py warm-multichunk/context-v5-${{ matrix.os }}.json

  compare:
    name: Compare Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: benchmark
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install -r requirements-ci.txt

    - name: Download Ubuntu Manifest
      uses: actions/download-artifact@v4
      with:
        name: manifest-ubuntu-latest
        path: manifest-ubuntu-latest

    - name: Download Windows Manifest
      uses: actions/download-artifact@v4
      with:
        name: manifest-windows-latest
        path: manifest-windows-latest

    - name: Cross-Platform Equivalence Check
      run: |
        python scripts/compare_manifests.py \
          manifest-ubuntu-latest/manifest-ubuntu-latest.json \
          manifest-windows-latest/manifest-windows-latest.json \
          --strict

    - name: Compare with Base Branch (PR only)
      if: github.event_name == 'pull_request'
      run: |
        echo "Fetching base branch ${{ github.base_ref }}..."
        git fetch origin ${{ github.base_ref }}

        # Checkout base ref to temporary folder to run benchmark there
        mkdir -p /tmp/base-code
        git archive origin/${{ github.base_ref }} | tar -x -C /tmp/base-code

        echo "Running benchmark on base branch..."
        cd /tmp/base-code
        python -m pip install -r requirements-ci.txt
        python benchmarks/benchmark_runner.py --manifest-out /tmp/manifest-base.json

        echo "Comparing PR manifest with base branch manifest..."
        cd $GITHUB_WORKSPACE
        python scripts/compare_manifests.py /tmp/manifest-base.json manifest-ubuntu-latest/manifest-ubuntu-latest.json
